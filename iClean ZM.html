<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iClean ZM</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F6F4EE; --surface:#FFFFFF; --ink:#16241C; --muted:#5C6B61;
  --line:#DDE3D8; --green:#1F5B3F; --green-deep:#133626; --amber:#D98E2B;
  --danger:#B4452E; --chip:#E7EFE3;
  color-scheme: light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101712; --surface:#17201A; --ink:#EDF2EC; --muted:#9BAAA0;
    --line:#2A362E; --green:#4C9A73; --green-deep:#2F6B4D; --amber:#E3A646;
    --chip:#1E2A22; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101712; --surface:#17201A; --ink:#EDF2EC; --muted:#9BAAA0;
  --line:#2A362E; --green:#4C9A73; --green-deep:#2F6B4D; --amber:#E3A646;
  --chip:#1E2A22; color-scheme: dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));position:relative;}
h1,h2,h3{font-weight:650;letter-spacing:-0.01em;margin:0 0 4px;}
p{margin:0 0 10px;color:var(--muted);line-height:1.45;}
.scr{padding:22px 18px 10px;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.btn{display:block;width:100%;padding:13px 16px;border-radius:12px;border:none;background:var(--green);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;text-align:center;}
.btn:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line);}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;display:inline-block;margin:4px 6px 0 0;}
.btn.danger{background:var(--danger);}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;margin-bottom:10px;font-family:inherit;}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.chip{display:inline-block;background:var(--chip);color:var(--green-deep);border-radius:999px;padding:6px 12px;font-size:13px;margin:0 6px 6px 0;cursor:pointer;border:1px solid transparent;}
.chip.sel{background:var(--green);color:#fff;}
.stat{text-align:center;flex:1;}
.stat b{display:block;font-size:20px;}
.stat span{font-size:11px;color:var(--muted);}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px;}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;}
.leaf{width:28px;height:28px;border-radius:9px;background:var(--green);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px;}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;max-width:480px;margin:0 auto;padding:8px 4px env(safe-area-inset-bottom,8px);}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;padding:6px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button.on{color:var(--green);font-weight:700;}
nav button .ic{font-size:18px;}
.status-track{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.badge{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--green-deep);}
.badge.done{background:var(--green);color:#fff;}
.hr{border:none;border-top:1px solid var(--line);margin:14px 0;}
.small{font-size:12px;color:var(--muted);}
.center{text-align:center;}
.logo-big{font-size:46px;margin-bottom:6px;}
footer{text-align:center;font-size:11px;color:var(--muted);padding:18px 0 90px;}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PROVINCES=["Lusaka","Copperbelt","Central","Eastern","Southern","Northern","Luapula","North-Western","Western","Muchinga"];
const CATS=[["Plastic","♳"],["Paper","📄"],["Cardboard","📦"],["Glass","🍾"],["Metal","🥫"],["Organic","🍂"],["Garden","🌿"],["General Household","🗑️"],["Textile","👕"],["Electronic","🔌"],["Construction","🧱"],["Bulk Commercial","🏭"]];
const RESTRICTED=["Electronic","Construction","Bulk Commercial"];
const CENTRES=[
 {n:"Lusaka Green Hub",prov:"Lusaka",dist:"Kabwata",mat:"Plastic, Paper, Glass",hrs:"Mon–Sat 08:00–17:00"},
 {n:"Kalingalinga Recyclers",prov:"Lusaka",dist:"Kalingalinga",mat:"Metal, Electronic",hrs:"Mon–Fri 07:30–16:30"},
 {n:"Kitwe EcoPoint",prov:"Copperbelt",dist:"Kitwe Central",mat:"Plastic, Cardboard, Metal",hrs:"Daily 08:00–18:00"},
 {n:"Livingstone Clean Collective",prov:"Southern",dist:"Livingstone",mat:"Glass, Organic, Garden",hrs:"Mon–Sat 09:00–16:00"},
];
const REWARDS=[
 {n:"10% off next pickup",c:120},
 {n:"ZMW 20 Airtime",c:300},
 {n:"Reusable iClean tote bag",c:90},
 {n:"Free bulk collection upgrade",c:450},
];
let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem("iclean_state"));if(r)return r;}catch(e){}
  return {screen:"splash",theme:"",user:null,points:0,bookings:[],reports:[],redemptions:[],lang:"English",otp:null};
}
function save(){ try{localStorage.setItem("iclean_state",JSON.stringify(S));}catch(e){} }
function go(scr){S.screen=scr;save();render();window.scrollTo(0,0);}
function setTheme(t){S.theme=t;document.documentElement.setAttribute("data-theme",t||"");save();render();}
function ref(p){return p+"-"+Math.random().toString(36).slice(2,7).toUpperCase();}

function render(){
  const app=document.getElementById("app");
  document.documentElement.setAttribute("data-theme",S.theme||"");
  app.innerHTML = {
    splash: splashView, onboard: onboardView, auth: authView,
    dashboard: dashboardView, book: bookView, centres: centresView,
    rewards: rewardsView, report: reportView, profile: profileView
  }[S.screen]();
  if(["dashboard","book","centres","rewards","profile"].includes(S.screen)) app.innerHTML += navView();
}

function splashView(){
  return `<div class="scr center" style="padding-top:22vh">
    <div class="logo-big">♻️</div>
    <h1>iClean ZM</h1>
    <p>Connecting Zambian households, waste collectors and recycling<br>companies — one pickup at a time.</p>
    <button class="btn" onclick="go('onboard')">Get started</button>
  </div>`;
}

function onboardView(){
  return `<div class="scr">
    <h2>A few quick settings</h2>
    <p>This helps us route your collections to the right team.</p>
    <label>Language</label>
    <select id="ob_lang">${["English","Nyanja","Bemba"].map(l=>`<option ${l===S.lang?"selected":""}>${l}</option>`).join("")}</select>
    <label>Province</label>
    <select id="ob_prov">${PROVINCES.map(p=>`<option>${p}</option>`).join("")}</select>
    <label>District / township</label>
    <input id="ob_dist" placeholder="e.g. Chilenje">
    <p class="small">Location and notification access are requested the first time they're needed, not before.</p>
    <button class="btn" onclick="finishOnboard()">Continue</button>
  </div>`;
}
function finishOnboard(){
  S.lang=document.getElementById("ob_lang").value;
  S.prov=document.getElementById("ob_prov").value;
  S.dist=document.getElementById("ob_dist").value||"—";
  save(); go("auth");
}

function authView(){
  if(S.otp) return `<div class="scr center" style="padding-top:12vh">
    <h2>Enter the code</h2>
    <p>We sent a 4-digit code to ${S.tempPhone}. For this demo, use <b>1234</b>.</p>
    <input id="otp_in" placeholder="4-digit code" maxlength="4" style="text-align:center;font-size:20px;letter-spacing:6px">
    <button class="btn" onclick="verifyOtp()">Verify &amp; continue</button>
  </div>`;
  return `<div class="scr center" style="padding-top:10vh">
    <div class="logo-big">♻️</div>
    <h2>Sign in to iClean ZM</h2>
    <p>Use the demo line <b>0977000000</b>, or type your own.</p>
    <input id="auth_name" placeholder="Full name">
    <input id="auth_phone" placeholder="Phone number" value="0977000000">
    <button class="btn" onclick="requestOtp()">Continue with phone</button>
    <p class="small" style="margin-top:14px">By continuing you accept the Terms and the Privacy Policy.</p>
  </div>`;
}
function requestOtp(){
  const name=document.getElementById("auth_name").value||"Guest Customer";
  const phone=document.getElementById("auth_phone").value||"0977000000";
  S.tempPhone=phone; S.tempName=name; S.otp="1234"; save(); render();
}
function verifyOtp(){
  const v=document.getElementById("otp_in").value;
  if(v!==S.otp){alert("Incorrect code. For this demo, use 1234.");return;}
  S.user={name:S.tempName,phone:S.tempPhone,email:"",prov:S.prov,dist:S.dist};
  S.otp=null; S.points=40; save(); go("dashboard");
}

function statusBar(b){
  const steps=["Pending","Confirmed","Assigned","En Route","Arrived","Collecting","Completed"];
  const i=steps.indexOf(b.status);
  return `<div class="status-track">${steps.map((s,idx)=>`<span class="badge ${idx<=i?'done':''}">${s}</span>`).join("")}</div>`;
}
function advance(ref){
  const steps=["Pending","Confirmed","Assigned","En Route","Arrived","Collecting","Completed"];
  const b=S.bookings.find(x=>x.ref===ref);
  const i=steps.indexOf(b.status);
  if(i<steps.length-1){
    b.status=steps[i+1];
    if(b.status==="Completed"){ const pts=Math.round(b.weight*(["Electronic","Metal","Plastic","Glass","Paper","Cardboard"].includes(b.cat)?3:1)); S.points+=pts; b.pointsEarned=pts; }
  }
  save(); render();
}
function cancelBooking(ref){
  const b=S.bookings.find(x=>x.ref===ref); b.status="Cancelled"; save(); render();
}

function dashboardView(){
  const active=S.bookings.filter(b=>!["Completed","Cancelled"].includes(b.status));
  const completed=S.bookings.filter(b=>b.status==="Completed");
  const totalW=completed.reduce((s,b)=>s+Number(b.weight||0),0);
  return `<div class="top"><div class="brand"><span class="leaf">♻</span>iClean ZM</div>
    <button class="btn sm ghost" onclick="go('profile')" style="margin:0">${S.user.name.split(" ")[0]}</button></div>
  <div class="scr" style="padding-top:4px">
    <p>Hi ${S.user.name.split(" ")[0]}, here's ${S.dist}, ${S.prov} today.</p>
    <div class="card row">
      <div class="stat"><b>${totalW}kg</b><span>Collected</span></div>
      <div class="stat"><b>${completed.length}</b><span>Pickups done</span></div>
      <div class="stat"><b>${S.points}</b><span>EcoPoints</span></div>
    </div>
    <div class="row">
      <button class="btn" onclick="go('book')">Book pickup</button>
      <button class="btn ghost" onclick="go('centres')">Find centre</button>
    </div>
    <hr class="hr">
    <h3>Active pickups</h3>
    ${active.length? active.map(b=>`<div class="card">
        <b>${b.cat}</b> · ${b.weight}kg · ${b.date} ${b.time}<br><span class="small">Ref ${b.ref} · ${b.location}</span>
        ${statusBar(b)}
        <button class="btn sm" onclick="advance('${b.ref}')">Simulate next status</button>
        <button class="btn sm ghost" onclick="cancelBooking('${b.ref}')">Cancel</button>
      </div>`).join("") : `<div class="empty">No active pickups yet. Book your first collection.</div>`}
    <h3>Recent history</h3>
    ${completed.slice(-3).reverse().map(b=>`<div class="card"><b>${b.cat}</b> · ${b.weight}kg · ${b.date}<br>
      <span class="small">Ref ${b.ref} · Paid via ${b.pay} · +${b.pointsEarned||0} pts</span></div>`).join("") || `<p class="small">Nothing completed yet.</p>`}
    <p class="small">Tip: rinse recyclables before collection — it earns extra EcoPoints and keeps collectors safer.</p>
  </div>`;
}

function bookView(){
  return `<div class="top"><h2 style="margin:0">Book a pickup</h2></div>
  <div class="scr" style="padding-top:4px">
    <label>Waste category</label>
    <div>${CATS.map(([c])=>`<span class="chip ${S._cat===c?'sel':''}" onclick="pick('_cat','${c}')">${c}</span>`).join("")}</div>
    ${RESTRICTED.includes(S._cat)?`<p class="small">⚠ ${S._cat} waste is routed only to collectors authorised and equipped for it.</p>`:""}
    <div class="row">
      <div><label>Estimated weight (kg)</label><input id="bk_w" type="number" min="1" value="5"></div>
      <div><label>Frequency</label><select id="bk_freq"><option>One-time</option><option>Weekly</option><option>Monthly</option></select></div>
    </div>
    <label>Collection address</label>
    <input id="bk_loc" placeholder="Plot / street, township" value="${S.dist||''}, ${S.prov||''}">
    <div class="row">
      <div><label>Date</label><input id="bk_date" type="date"></div>
      <div><label>Time</label><input id="bk_time" type="time" value="09:00"></div>
    </div>
    <label>Payment method</label>
    <select id="bk_pay"><option>Airtel Money</option><option>MTN MoMo</option><option>Cash on collection</option></select>
    <label>Collection instructions (optional)</label>
    <textarea id="bk_inst" rows="2" placeholder="Gate code, nearby landmark..."></textarea>
    <div class="card small">Estimated fee: <b>ZMW ${feeFor()}</b> · residential rate</div>
    <button class="btn" onclick="submitBooking()">Confirm booking</button>
  </div>`;
}
function pick(k,v){S[k]=S[k]===v?null:v;render();}
function feeFor(){return S._cat && RESTRICTED.includes(S._cat) ? 90 : 35;}
function submitBooking(){
  if(!S._cat){alert("Choose a waste category first.");return;}
  const b={ref:ref("PU"),cat:S._cat,weight:document.getElementById("bk_w").value,
    freq:document.getElementById("bk_freq").value,location:document.getElementById("bk_loc").value,
    date:document.getElementById("bk_date").value||"TBD",time:document.getElementById("bk_time").value,
    pay:document.getElementById("bk_pay").value,inst:document.getElementById("bk_inst").value,
    fee:feeFor(),status:"Pending"};
  S.bookings.push(b); S._cat=null; save();
  alert("Booked! Reference "+b.ref+". Track it from your dashboard.");
  go("dashboard");
}

function centresView(){
  const f=S._centreFilter||"All";
  const mats=["All","Plastic","Paper","Glass","Metal","Organic"];
  const list=CENTRES.filter(c=>f==="All"||c.mat.includes(f));
  return `<div class="top"><h2 style="margin:0">Recycling centres</h2></div>
  <div class="scr" style="padding-top:4px">
    <div>${mats.map(m=>`<span class="chip ${f===m?'sel':''}" onclick="S._centreFilter='${m}';render()">${m}</span>`).join("")}</div>
    ${list.map(c=>`<div class="card"><b>${c.n}</b><br><span class="small">${c.dist}, ${c.prov} · ${c.hrs}</span>
      <p style="margin:8px 0 0">Accepts: ${c.mat}</p>
      <button class="btn sm" onclick="alert('Directions would open your maps app for ${c.n}.')">Get directions</button></div>`).join("")}
  </div>`;
}

function rewardsView(){
  return `<div class="top"><h2 style="margin:0">EcoPoints &amp; rewards</h2></div>
  <div class="scr" style="padding-top:4px">
    <div class="card center"><span class="small">Balance</span><h1>${S.points} pts</h1></div>
    <h3>Redeem</h3>
    ${REWARDS.map(r=>`<div class="card row" style="align-items:center">
      <div><b>${r.n}</b><br><span class="small">${r.c} pts</span></div>
      <button class="btn sm" ${S.points<r.c?'disabled style="opacity:.4"':''} onclick="redeem('${r.n}',${r.c})">Redeem</button>
    </div>`).join("")}
    <h3>Redemption history</h3>
    ${S.redemptions.length? S.redemptions.slice().reverse().map(r=>`<p class="small">${r.n} · −${r.c} pts</p>`).join("") : `<p class="small">No redemptions yet.</p>`}
  </div>`;
}
function redeem(n,c){
  if(S.points<c)return;
  S.points-=c; S.redemptions.push({n,c}); save(); render();
  alert("Redeemed: "+n);
}

function reportView(){
  return `<div class="top"><h2 style="margin:0">Report illegal dumping</h2></div>
  <div class="scr" style="padding-top:4px">
    <p>Help keep your community clean — reports are reviewed and referred to participating local authorities.</p>
    <div class="row">
      <div><label>Province</label><select id="rp_prov">${PROVINCES.map(p=>`<option ${p===S.prov?'selected':''}>${p}</option>`).join("")}</select></div>
      <div><label>District</label><input id="rp_dist" value="${S.dist||''}"></div>
    </div>
    <label>What kind of waste?</label>
    <select id="rp_cat">${CATS.map(([c])=>`<option>${c}</option>`).join("")}</select>
    <label>Location description</label>
    <input id="rp_desc" placeholder="e.g. Behind Chilenje market, near the bridge">
    <label><input type="checkbox" id="rp_anon" style="width:auto;margin-right:6px">Report anonymously</label>
    <button class="btn danger" onclick="submitReport()">Submit report</button>
    <h3 style="margin-top:18px">Your reports</h3>
    ${S.reports.length? S.reports.slice().reverse().map(r=>`<div class="card small">Ref ${r.ref} · ${r.cat} · ${r.dist}, ${r.prov}<br>Status: Submitted for review</div>`).join("") : `<p class="small">No reports filed yet.</p>`}
  </div>${navView()}`;
}
function submitReport(){
  const r={ref:ref("DP"),prov:document.getElementById("rp_prov").value,dist:document.getElementById("rp_dist").value,
    cat:document.getElementById("rp_cat").value,desc:document.getElementById("rp_desc").value,
    anon:document.getElementById("rp_anon").checked};
  S.reports.push(r); save();
  alert("Report filed. Reference "+r.ref+".");
  go("dashboard");
}

function profileView(){
  return `<div class="top"><h2 style="margin:0">Profile &amp; settings</h2></div>
  <div class="scr" style="padding-top:4px">
    <div class="card center"><div class="leaf" style="width:52px;height:52px;font-size:24px;margin:0 auto 8px">${S.user.name[0]}</div>
      <b>${S.user.name}</b><br><span class="small">${S.user.phone}</span></div>
    <label>Full name</label><input id="pf_name" value="${S.user.name}">
    <label>Phone</label><input id="pf_phone" value="${S.user.phone}">
    <label>Province</label><select id="pf_prov">${PROVINCES.map(p=>`<option ${p===S.user.prov?'selected':''}>${p}</option>`).join("")}</select>
    <button class="btn ghost" onclick="saveProfile()">Save changes</button>
    <hr class="hr">
    <div class="row"><span class="small">Appearance</span></div>
    <div class="row">
      <button class="btn sm ${S.theme===''?'':''}" onclick="setTheme('')">Auto</button>
      <button class="btn sm ghost" onclick="setTheme('light')">Light</button>
      <button class="btn sm ghost" onclick="setTheme('dark')">Dark</button>
    </div>
    <hr class="hr">
    <button class="btn sm ghost" onclick="go('report')">Report illegal dumping</button>
    <button class="btn danger" onclick="logout()">Log out</button>
    <p class="small" style="margin-top:14px">Account deletion and deactivation can be requested from Help &amp; Support.</p>
    <footer>© 2026 All Rights Reserved. Built by Chembe Mulila — iClean ZM</footer>
  </div>`;
}
function saveProfile(){
  S.user.name=document.getElementById("pf_name").value;
  S.user.phone=document.getElementById("pf_phone").value;
  S.user.prov=document.getElementById("pf_prov").value;
  save(); render(); alert("Profile updated.");
}
function logout(){ S.screen="auth"; S.user=null; save(); render(); }

function navView(){
  const items=[["dashboard","🏠","Home"],["book","🚛","Book"],["centres","♻️","Centres"],["rewards","🎁","Rewards"],["profile","👤","Profile"]];
  return `<nav>${items.map(([k,ic,l])=>`<button class="${S.screen===k?'on':''}" onclick="go('${k}')"><span class="ic">${ic}</span>${l}</button>`).join("")}</nav>`;
}
render();
</script>
</body>
</html>
